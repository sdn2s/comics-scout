{{define "layout"}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comics Scout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface-2: #161616;
      --border: #1f1f1f;
      --border-strong: #2a2a2a;
      --text: #ededed;
      --text-dim: #8a8a8a;
      --text-faint: #5a5a5a;
      --accent: #ededed;
      --accent-fg: #0a0a0a;
      --danger: #f87171;
      --danger-bg: #1a0e0e;
      --warn: #fbbf24;
      --warn-bg: #1a1407;
      --radius: 6px;
      --radius-sm: 4px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    code, .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

    a { color: var(--text); text-decoration: none; }
    a:hover { color: var(--text); }

    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 24px 80px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 22px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      letter-spacing: -0.01em;
      font-size: 15px;
    }

    .brand .dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--accent);
    }

    nav {
      display: flex;
      gap: 4px;
    }

    nav a {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      transition: color 120ms ease, background 120ms ease;
    }

    nav a:hover {
      color: var(--text);
      background: var(--surface);
    }

    h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.02em; }
    h1 { font-size: 22px; }
    h2 { font-size: 16px; }

    p { margin: 0; }
    .muted { color: var(--text-dim); }
    .faint { color: var(--text-faint); font-size: 12px; }

    .stack { display: flex; flex-direction: column; gap: 16px; }
    .stack-sm { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-head .lead { display: flex; flex-direction: column; gap: 4px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.01em;
    }

    input, select {
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 120ms ease, background 120ms ease;
    }

    input::placeholder { color: var(--text-faint); }

    input:focus, select:focus {
      border-color: #444;
      background: #1a1a1a;
    }

    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
      text-decoration: none;
    }

    button:hover, .btn:hover {
      background: #1f1f1f;
      border-color: #353535;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }
    .btn-primary:hover { background: #ffffff; border-color: #ffffff; }

    .btn-danger {
      color: var(--danger);
      border-color: #3a1a1a;
    }
    .btn-danger:hover { background: var(--danger-bg); border-color: #4a1f1f; }

    .form-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .login-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .notice {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text-dim);
      font-size: 13px;
    }

    .notice.ok { color: var(--warn); border-color: #3a2e0a; background: var(--warn-bg); }
    .notice.error { color: var(--danger); border-color: #3a1a1a; background: var(--danger-bg); }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .comic {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 120ms ease;
    }

    .comic:hover { border-color: var(--border-strong); }

    .comic .thumb {
      aspect-ratio: 1 / 1;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }

    .comic .thumb img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .comic .meta {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .badge.mono { font-family: "JetBrains Mono", monospace; }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .kv {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .kv:last-child { border-bottom: 0; }
    .kv .k { color: var(--text-dim); }
    .kv .v { color: var(--text); font-family: "JetBrains Mono", monospace; font-size: 12px; }

    .summary {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0 18px;
      font-size: 13px;
      color: var(--text-dim);
    }

    footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 12px;
    }

    @media (max-width: 720px) {
      .form-row, .login-row { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="dot"></span> Comics Scout</div>
      <nav>
        <a href="/">Поиск</a>
        <a href="/admin">Админ</a>
      </nav>
    </header>
    <main>
      {{.Body}}
    </main>
    <footer>
      XKCD index · поиск через api/search/words/update
    </footer>
  </div>
</body>
</html>
{{end}}
